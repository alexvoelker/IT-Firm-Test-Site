<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Firm Website</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/login_styles.css">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/9.3.0/mdb.min.css" rel="stylesheet" />
</head>

<body>
    <header>
        <div class="navbarCompanyLogo">IT Firm</div>
        <div class="navbarLinks">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Help and Contact</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </div>
    </header>

    <main class="gradient-custom">
        <section class="vh-10 login-form">
            <div class="container py-1 h-75">
                <div class="row d-flex justify-content-center align-items-center h-100">
                    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                        <div class="card bg-dark text-white" style="border-radius: 1rem;">
                            <div class="card-body p-5 text-center">

                                <div class="mb-md-5 mt-md-4 pb-5">

                                    <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
                                    <p class="text-white-50 mb-5">Please enter your login and password!</p>

                                    <div data-mdb-input-init class="form-outline form-white mb-4">
                                        <input type="email" id="typeEmailX" class="form-control form-control-lg" />
                                        <label class="form-label" for="typeEmailX">Email</label>
                                    </div>

                                    <div data-mdb-input-init class="form-outline form-white mb-4">
                                        <input type="password" id="typePasswordX"
                                            class="form-control form-control-lg" />
                                        <label class="form-label" for="typePasswordX">Password</label>
                                    </div>

                                    <p class="small mb-5 pb-lg-2"><a class="text-white-50" href="#!">Forgot
                                            password?</a></p>

                                    <a href="dashboard.html">
                                        <button id="loginButton" 
                                            class="btn btn-outline-light btn-lg px-5">Login</button>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footerSocialMediaIcons">
            <ul>
                <li><a href=""><img src="assets/images/facebook_logo.svg" alt="Company Facebook Account Link"></a></li>
                <li><a href=""><img src="assets/images/linkedin_logo.svg" alt="Company LinkedIn Account Link"></a></li>
                <li><a href=""><img src="assets/images/x_logo.svg" alt="Company X Account Link"></a></li>
                <li><a href=""><img src="assets/images/youtube_logo.svg" alt="Company Youtube Account Link"></a></li>
            </ul>
        </div>
        <div class="footerLinks">
            <ul>
                <li><a href="">Terms of Service</a></li>
                <li><a href="">Privacy Policy</a></li>
                <li><a href="">&copy; IT Firm <span id="copyrightYear"></span></a></li>
            </ul>
        </div>
    </footer>
    <script src="assets/scripts/script.js"></script>
    <!-- MDB -->
    <script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/9.3.0/mdb.umd.min.js"></script>
</body>

</html>
