<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Firm Website</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/account_styles.css">
</head>

<body>
    <header>
        <div class="navbarCompanyLogo">IT Firm</div>
        <div class="navbarLinks">
            <ul class="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Help and Contact</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <!-- Make a divider here in CSS -->

                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="account.html" aria-current="page">Account</a></li>
                <li class="logoutButton"><a href="index.html">Logout</a></li>

            </ul>
        </div>
    </header>

    <main>
        <div class="fieldset-form-container">
            <form action="#" method="post">
                <h2>Account Profile</h2>
            
                <fieldset>
                    <legend>User Identity</legend>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email">
                    </div>
                </fieldset>
            
                <fieldset>
                    <legend>Security</legend>
                    <div class="form-group">
                        <label for="current-password">Current Password</label>
                        <input type="password" id="current-password" name="current_password">
                    </div>
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" name="new_password">
                    </div>
                </fieldset>
                
                <fieldset>
                    <legend>Contact Information</legend>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="address">Mailing Address</label>
                        <input type="text" id="address" name="address">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Payment Information</legend>
                    <div class="form-group">
                        <label for="phone">Credit Card</label>
                        <input type="text" id="payment" name="payment">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Plan</legend>
                    <div class="form-group">
                        <label for="phone">Plan Tier</label>
                        <input type="text" id="plan" name="plan">
                    </div>
                </fieldset>
                
                <button type="submit" class="submit-btn">Save Changes</button>
            </form>
        </div>

    </main>

    <footer>
        <div class="footerSocialMediaIcons">
            <ul>
                <li><a href=""><img src="assets/images/facebook_logo.svg" alt="Company Facebook Account Link"></a></li>
                <li><a href=""><img src="assets/images/linkedin_logo.svg" alt="Company LinkedIn Account Link"></a></li>
                <li><a href=""><img src="assets/images/x_logo.svg" alt="Company X Account Link"></a></li>
                <li><a href=""><img src="assets/images/youtube_logo.svg" alt="Company Youtube Account Link"></a></li>
            </ul>
        </div>
        <div class="footerLinks">
            <ul>
                <li><a href="">Terms of Service</a></li>
                <li><a href="">Privacy Policy</a></li>
                <li><a href="">&copy; IT Firm <span id="copyrightYear"></span></a></li>
            </ul>
        </div>
    </footer>
    <script src="assets/scripts/script.js"></script>
</body>

</html>
